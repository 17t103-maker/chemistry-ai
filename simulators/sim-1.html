"知识重点":`<h3 class="section-title">卤素的物理性质</h3><p class="lead">卤素原子最外层有7个电子。课本指出，常温下卤素单质的物理状态、颜色等性质呈现规律性变化。</p><table class="data-table"><tr><th>单质</th><th>分子式</th><th>常温状态</th><th>颜色（课本）</th></tr><tr><td>氟</td><td>F₂</td><td>气体</td><td>淡黄绿色</td></tr><tr><td>氯</td><td>Cl₂</td><td>气体</td><td>黄绿色</td></tr><tr><td>溴</td><td>Br₂</td><td>液体</td><td>深红棕色</td></tr><tr><td>碘</td><td>I₂</td><td>固体</td><td>紫黑色</td></tr></table><div class="callout">随着卤素原子序数增加，分子间作用力增强，熔点、沸点及密度整体呈增加趋势。不同卤素在水中的溶解性也不同。</div><h3 class="section-title">化学性质：与金属反应</h3><div class="eq">2Na + Cl₂ → 2NaCl</div><div class="eq">2Fe + 3Cl₂ → 2FeCl₃</div><div class="eq">Cu + Cl₂ → CuCl₂</div><h3 class="section-title">与非金属反应</h3><div class="eq">H₂ + Cl₂ → 2HCl <small>光照条件下反应</small></div><div class="eq">H₂ + Br₂ ⇌ 2HBr <small>加热条件</small></div><div class="eq">H₂ + I₂ ⇌ 2HI <small>加热条件，可逆反应</small></div><h3 class="section-title">与水及碱反应</h3><div class="eq">Cl₂ + H₂O ⇌ HCl + HClO</div><div class="eq">2HClO → 2HCl + O₂</div><div class="eq">Cl₂ + 2NaOH → NaCl + NaClO + H₂O <small>冷稀碱</small></div><div class="eq">3Cl₂ + 6NaOH → 5NaCl + NaClO₃ + 3H₂O <small>热浓碱</small></div><h3 class="section-title">卤素的氧化性</h3><p class="lead">课本以卤素置换反应比较氧化性：较强氧化性的卤素单质可以从卤化物中置换出较弱氧化性的卤素。</p><div class="eq">Cl₂ + 2KBr → 2KCl + Br₂</div><div class="eq">Cl₂ + 2KI → 2KCl + I₂</div><div class="eq">Br₂ + 2KI → 2KBr + I₂</div><div class="callout">本章比较顺序：Cl₂ 的氧化性强于 Br₂，Br₂ 的氧化性强于 I₂。氟的氧化性最强。</div>`,

"学习导览":`<h3 class="section-title">氯气制备任务</h3><p class="lead">本岛分为实验室制法与工业制法，重点理解反应原理、装置各部分作用及产物。</p><div class="info-grid"><div class="info-card"><b>实验室制法</b><small>浓盐酸与二氧化锰反应</small></div><div class="info-card"><b>工业制法</b><small>电解饱和食盐水</small></div></div><div class="callout">学习时要区分实验室制备与工业生产的反应物、条件及产物。</div>`,
"知识重点":`<h3 class="section-title">实验室制取氯气</h3><div class="eq">4HCl(aq) + MnO₂(s) → MnCl₂(aq) + 2H₂O(l) + Cl₂(g) <small>课本实验室制法；加热条件</small></div><p class="lead">课本装置包括发生、净化、干燥及收集等环节。氯气有毒，实验必须在具备安全设施的专业实验室进行。</p><h3 class="section-title">工业制取氯气：电解饱和食盐水</h3><div class="eq">阳极：2Cl⁻ → Cl₂ + 2e⁻</div><div class="eq">阴极：2H₂O + 2e⁻ → H₂ + 2OH⁻</div><div class="eq">总反应：2NaCl + 2H₂O → 2NaOH + H₂ + Cl₂</div><div class="callout">工业电解同时得到氯气、氢气及氢氧化钠。离子交换膜用于分隔两极区域，避免产物进一步发生不需要的反应。</div>`,
"实验模拟":`<h3 class="section-title">工业电解槽互动模型</h3><p class="lead">点击启动电解，观察离子移动方向及两极产物。此处为原理示意，不模拟真实电流、电压或产率。</p><div class="sim-box"><div style="display:flex;justify-content:space-around;align-items:center;padding:12px"><div class="info-card" style="text-align:center"><b style="color:#f1a16e">阳极 (+)</b><small>Cl⁻ 放电<br>生成 Cl₂</small></div><div style="font-size:22px;color:var(--mint)">⇄</div><div class="info-card" style="text-align:center"><b style="color:#78c8ef">阴极 (−)</b><small>水得到电子<br>生成 H₂、OH⁻</small></div></div><div id="electrolysisStatus" class="callout">电解槽待启动。</div><button class="action" id="startElectrolysis">启动电解演示</button></div><div class="callout">安全提醒：氯气有毒，氢气易燃。此内容仅供理论学习，不可作为自行制作电解装置的操作指南。</div>`,
"互动挑战":quizHTML([["实验室制取氯气常用的氧化剂是？",["MnO₂","NaCl","NaOH","AgNO₃"],0,"课本实验室制法使用二氧化锰氧化浓盐酸。"],["电解饱和食盐水时，氯气在什么电极产生？",["阴极","阳极","两极均产生","盐桥"],1,"氯离子在阳极失去电子生成氯气。"],["电解饱和食盐水的另一种主要碱性产物是？",["HCl","NaOH","H₂SO₄","Na₂CO₃"],1,"阴极区域生成OH⁻，与Na⁺形成NaOH。"]]),
"本岛总结":`<h3 class="section-title">制备方法比较</h3><table class="data-table"><tr><th>比较</th><th>实验室</th><th>工业</th></tr><tr><td>原料</td><td>浓HCl、MnO₂</td><td>饱和NaCl溶液、水</td></tr><tr><td>方法</td><td>氧化还原反应</td><td>电解</td></tr><tr><td>产物</td><td>Cl₂</td><td>Cl₂、H₂、NaOH</td></tr></table><button class="action" onclick="completeIsland(1)">完成氯气制备岛</button>`
},
2:{
"学习导览":`<h3 class="section-title">氯化氢研究任务</h3><p class="lead">认识氯化氢气体与盐酸的关系，学习氯化氢的物理性质、化学性质、用途及制备。</p><div class="callout">注意区分：HCl(g) 表示氯化氢气体；HCl(aq) 表示盐酸中的溶质状态。</div>`,
"知识重点":`<h3 class="section-title">氯化氢的性质</h3><div class="info-grid"><div class="info-card"><b>物理性质</b><small>无色气体，极易溶于水。</small></div><div class="info-card"><b>水溶液</b><small>氯化氢溶于水形成盐酸。</small></div></div><h3 class="section-title">化学性质及用途</h3><div class="eq">HCl(aq) + NaOH(aq) → NaCl(aq) + H₂O(l)</div><div class="eq">HCl(g) + NH₃(g) → NH₄Cl(s)</div><h3 class="section-title">氯化氢的制备</h3><div class="eq">NaCl(s) + H₂SO₄(浓) → NaHSO₄(s) + HCl(g)</div><div class="eq">H₂(g) + Cl₂(g) → 2HCl(g)</div><small style="color:var(--muted)">工业合成反应需控制适当条件；课本介绍氢气与氯气化合制氯化氢。</small>`,
"实验模拟":`<h3 class="section-title">氯化氢喷泉实验原理</h3><p class="lead">氯化氢极易溶于水。气体溶解使容器内压强降低，外部液体在压强差作用下进入容器，形成喷泉现象。</p><div class="sim-box"><div class="sim-stage"><div class="flask" style="height:90px"><div class="liquid" id="fountainLiquid" style="height:8%;background:rgba(100,170,230,.65)"></div></div></div><div id="fountainText" class="feedback">点击按钮，观察示意动画。</div><button class="action" id="fountainBtn">启动喷泉模拟</button></div><div class="callout">本动画仅呈现压强变化的概念，不代表真实实验装置或操作步骤。</div>`,
"互动挑战":quizHTML([["氯化氢气体溶于水后形成什么？",["氯水","盐酸","次氯酸","漂白液"],1,"氯化氢的水溶液称为盐酸。"],["氯化氢喷泉实验的主要原因是？",["氯化氢难溶于水","氯化氢极易溶于水","氯化氢生成沉淀","氯化氢受热膨胀"],1,"氯化氢迅速溶解使容器内压强下降，形成压强差。"],["氯化氢与氨气反应生成的白色固体是？",["NaCl","NH₄Cl","CaCl₂","KCl"],1,"氯化氢与氨气化合生成氯化铵。"]]),
"本岛总结":`<h3 class="section-title">本岛重点</h3><div class="info-card"><b>必须区分</b><small>HCl(g)：氯化氢气体<br>HCl(aq)：盐酸<br>喷泉实验：气体易溶于液体造成压强差</small></div><button class="action" onclick="completeIsland(2)">完成氯化氢岛</button>`
},

function toast(s){let t=document.getElementById("toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
let activeIsland=0,activeTab="";
function openIsland(id){activeIsland=id;const x=islands[id];document.getElementById("panelKicker").textContent="ISLAND "+x.no+" · "+x.en;document.getElementById("panelTitle").textContent=x.name;document.getElementById("panelDesc").textContent=x.desc;document.getElementById("panelPages").textContent=x.pages;document.getElementById("panelStatus").textContent=state.completed.includes(id)?"已完成 ✓":"尚未完成";document.getElementById("panelStars").textContent="☆ "+(state.completed.includes(id)?3:0)+" / 3";document.getElementById("tabs").innerHTML=x.sections.map((t,i)=>`<button class="tab ${i===0?"active":""}" data-tab="${t}">${t}</button>`).join("");document.getElementById("panel").classList.add("open");showTab(x.sections[0]);if(window.focusIsland)focusIsland(id)}
function showTab(tab){activeTab=tab;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));document.getElementById("panelContent").innerHTML=content[activeIsland][tab]||"<p>内容准备中。</p>";wirePanel()}
function wirePanel(){
document.querySelectorAll("[data-quiz]").forEach(card=>{let idx=+card.dataset.quiz;card.querySelectorAll(".option").forEach(btn=>btn.onclick=()=>{if(card.dataset.done)return;let picked=+btn.dataset.option;let q=extractQuiz(activeIsland,activeTab,idx);if(!q)return;let correct=picked===q[2];card.dataset.done="1";card.querySelectorAll(".option").forEach((b,j)=>{if(j===q[2])b.classList.add("correct");else if(j===picked)b.classList.add("wrong");b.disabled=true});let fb=document.getElementById("fb"+idx);fb.className="feedback "+(correct?"good":"bad");fb.textContent=(correct?"回答正确！":"再留意这个概念。")+q[3];state.answered++;if(correct){state.correct++;state.stars++;toast("答对了！获得 1 颗星星 ✦")}save();})});
let retry=document.getElementById("retryQuiz");if(retry)retry.onclick=()=>{showTab(activeTab)};
let run=document.getElementById("runReaction");if(run)run.onclick=()=>{let v=document.getElementById("reactionSelect").value,li=document.getElementById("simLiquid"),txt=document.getElementById("simText");let m={clbr:["rgba(190,90,45,.75)","溶液呈现溴的橙棕色，说明Cl₂将Br⁻氧化为Br₂。方程式：Cl₂ + 2KBr → 2KCl + Br₂。"],cli:["rgba(100,65,150,.8)","生成碘单质，呈现碘的特征颜色。方程式：Cl₂ + 2KI → 2KCl + I₂。"],brI:["rgba(150,85,130,.8)","溴将I⁻氧化为I₂。方程式：Br₂ + 2KI → 2KBr + I₂。"],clwater:["rgba(120,180,140,.45)","氯气与水建立可逆反应：Cl₂ + H₂O ⇌ HCl + HClO。"]};li.style.height="65%";li.style.background=m[v][0];txt.textContent=m[v][1]};
let el=document.getElementById("startElectrolysis");if(el)el.onclick=()=>{document.getElementById("electrolysisStatus").innerHTML="演示中：Cl⁻ 移向阳极并失去电子形成 Cl₂；水在阴极得到电子，形成H₂与OH⁻。溶液中Na⁺与OH⁻对应形成NaOH。";el.textContent="重新观看演示"};
let f=document.getElementById("fountainBtn");if(f)f.onclick=()=>{document.getElementById("fountainLiquid").style.height="88%";document.getElementById("fountainText").textContent="氯化氢溶解，容器内压强下降，外部液体进入，形成喷泉现象。"};
let ag=document.getElementById("addAg");if(ag)ag.onclick=()=>{let v=document.getElementById("halideSelect").value,p=document.getElementById("precipitate"),t=document.getElementById("precipitateText"),m={cl:["#f0eee4","AgCl白色沉淀：说明溶液中含Cl⁻。"],br:["#e6d5a2","AgBr淡黄色沉淀：说明溶液中含Br⁻。"],i:["#d9a92e","AgI黄色沉淀：说明溶液中含I⁻。"]};p.style.height="28px";p.style.background=m[v][0];t.textContent=m[v][1]};
let ox=document.getElementById("oxySelect");if(ox)ox.onchange=()=>{let n=+ox.value;document.getElementById("oxyFormula").textContent="HXO"+"₂".repeat(n-1);document.getElementById("oxyNumber").textContent="X 的氧化数：+"+(2*n-1)};
}
function extractQuiz(id,tab,idx){let data=content[id][tab];let temp=document.createElement("div");temp.innerHTML=data;let card=temp.querySelectorAll("[data-quiz]")[idx];if(!card)return null;let q=card.querySelector(".quiz-q").textContent.replace(/^Q\d+\.\s*/,"");let opts=[...card.querySelectorAll(".option")].map(b=>b.textContent.replace(/^[A-D]\.\s*/,""));let fb=card.querySelector(".feedback").textContent;let arr=quizBank[id]?.[tab];return arr?arr[idx]:null}
function completeIsland(id){if(!state.completed.includes(id)){state.completed.push(id);state.stars+=3;save();toast("岛屿完成！获得 3 颗星星 ✦")}openIsland(id)}
function resetProgress(){if(confirm("确定清除本机保存的所有学习记录？")){state={completed:[],stars:0,answered:0,correct:0};save();openIsland(5);showTab("学习档案")}}
document.getElementById("tabs").addEventListener("click",e=>{let b=e.target.closest("[data-tab]");if(b)showTab(b.dataset.tab)});
document.getElementById("closePanel").onclick=()=>document.getElementById("panel").classList.remove("open");
document.getElementById("overviewBtn").onclick=()=>{document.getElementById("panel").classList.remove("open");if(window.resetCamera)resetCamera()};
document.getElementById("directoryBtn").onclick=()=>{document.getElementById("searchModal").classList.add("open");document.getElementById("searchInput").value="";renderSearch("")};
document.getElementById("searchOpen").onclick=()=>document.getElementById("directoryBtn").click();
document.getElementById("progressBtn").onclick=()=>{openIsland(5);showTab("学习档案")};
document.getElementById("resetViewBtn").onclick=()=>window.resetCamera&&resetCamera();
document.getElementById("searchModal").onclick=e=>{if(e.target.id==="searchModal")e.currentTarget.classList.remove("open")};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){document.getElementById("panel").classList.remove("open");document.getElementById("searchModal").classList.remove("open")}});
document.getElementById("searchInput").oninput=e=>renderSearch(e.target.value);
function renderSearch(q){let terms=[["卤素物理性质",0,"颜色、状态、熔点、沸点及密度"],["卤素氧化性",0,"卤素置换反应"],["氯气实验室制法",1,"浓盐酸与二氧化锰"],["电解饱和食盐水",1,"氯气工业制法"],["氯化氢喷泉实验",2,"氯化氢极易溶于水"],["AgCl、AgBr、AgI",3,"卤离子沉淀鉴定"],["卤氧酸",4,"HXO、HXO₂、HXO₃、HXO₄"],["综合练习",5,"本章复习与考试挑战"]];let list=terms.filter(x=>(x[0]+x[2]).toLowerCase().includes(q.toLowerCase()));document.getElementById("searchResults").innerHTML=list.map(x=>`<button class="search-result" data-go="${x[1]}">${x[0]}<small>${x[2]}</small></button>`).join("")||"<p class='lead'>没有找到相关知识。</p>";document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{document.getElementById("searchModal").classList.remove("open");openIsland(+b.dataset.go)})}
updateHUD();

// Three.js scene
let scene,camera,renderer,controls,raycaster,mouse,group,islandMeshes=[],targetCamera;
function init3D(){
const canvas=document.getElementById("scene");
if(!window.THREE){canvas.style.display="none";return}
scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x0a2936,.012);
camera=new THREE.PerspectiveCamera(45,canvas.clientWidth/canvas.clientHeight,.1,500);camera.position.set(0,19,31);
renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(canvas.clientWidth,canvas.clientHeight);renderer.shadowMap.enabled=true;
scene.add(new THREE.HemisphereLight(0xbce9e2,0x17313d,1.5));
let sun=new THREE.DirectionalLight(0xffedc9,2.1);sun.position.set(-12,25,12);sun.castShadow=true;scene.add(sun);
controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.06;controls.minDistance=14;controls.maxDistance=48;controls.maxPolarAngle=Math.PI*.48;controls.target.set(0,0,0);
group=new THREE.Group();scene.add(group);
let ocean=new THREE.Mesh(new THREE.CircleGeometry(24,80),new THREE.MeshStandardMaterial({color:0x123c4a,roughness:.35,metalness:.25,transparent:true,opacity:.7}));ocean.rotation.x=-Math.PI/2;ocean.position.y=-1.6;group.add(ocean);
let positions=[[-8,0,-5],[0,0,-8],[8,0,-4],[-8,0,5],[1,0,6],[9,0,5]];
islands.forEach((d,i)=>{let x=positions[i][0],z=positions[i][2],col=d.color;let g=new THREE.Group();g.position.set(x,0,z);group.add(g);
let top=new THREE.Mesh(new THREE.CylinderGeometry(3.15,2.35,.9,7,1),new THREE.MeshStandardMaterial({color:col,roughness:.82,flatShading:true}));top.position.y=0;top.castShadow=true;top.receiveShadow=true;g.add(top);
let lower=new THREE.Mesh(new THREE.ConeGeometry(2.4,2.7,7),new THREE.MeshStandardMaterial({color:new THREE.Color(col).multiplyScalar(.55),flatShading:true}));lower.position.y=-1.65;lower.rotation.y=.2;g.add(lower);
let cap=new THREE.Mesh(new THREE.CylinderGeometry(2.65,3.05,.16,7),new THREE.MeshStandardMaterial({color:new THREE.Color(col).multiplyScalar(1.1),roughness:.8}));cap.position.y=.49;g.add(cap);
let rockMat=new THREE.MeshStandardMaterial({color:0x52716c,flatShading:true});
for(let k=0;k<5;k++){let rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.45+Math.random()*.35,0),rockMat);let a=k*1.25;rock.position.set(Math.cos(a)*2.2,.65,Math.sin(a)*1.8);rock.scale.y=.7;g.add(rock)}
// Landmark unique to each island
if(i===0){let atom=new THREE.Group();let nucleus=new THREE.Mesh(new THREE.SphereGeometry(.42,16,12),new THREE.MeshStandardMaterial({color:0xf4d477,emissive:0x77551b}));atom.add(nucleus);for(let j=0;j<3;j++){let ring=new THREE.Mesh(new THREE.TorusGeometry(.95,.035,8,48),new THREE.MeshStandardMaterial({color:0xe8f5e8}));ring.rotation.set(j*.8,j*.65,0);atom.add(ring)}atom.position.y=1.55;g.add(atom)}
if(i===1){let tower=new THREE.Mesh(new THREE.CylinderGeometry(.48,.62,2.1,8),new THREE.MeshStandardMaterial({color:0xb8d5df,metalness:.45,roughness:.35}));tower.position.y=1.45;g.add(tower);let chimney=new THREE.Mesh(new THREE.CylinderGeometry(.18,.24,1.1,8),new THREE.MeshStandardMaterial({color:0x425b69}));chimney.position.set(.5,2.7,0);g.add(chimney)}
if(i===2){let bubble=new THREE.Mesh(new THREE.SphereGeometry(.75,18,14),new THREE.MeshPhysicalMaterial({color:0xa8d9e5,transparent:true,opacity:.55,roughness:.12}));bubble.position.y=1.7;g.add(bubble)}
if(i===3){for(let k=0;k<3;k++){let crystal=new THREE.Mesh(new THREE.OctahedronGeometry(.65,0),new THREE.MeshStandardMaterial({color:[0xf6edcf,0xd9c28d,0xf0cf56][k],metalness:.25,roughness:.25}));crystal.position.set((k-1)*.8,1.1+(k%2)*.4,0);g.add(crystal)}}
if(i===4){let molecule=new THREE.Group();for(let k=0;k<5;k++){let atom=new THREE.Mesh(new THREE.SphereGeometry(.28,12,10),new THREE.MeshStandardMaterial({color:k===0?0xf1d16f:0xeaf4ef}));atom.position.set(Math.cos(k*1.25)*.85,Math.sin(k*1.25)*.5,0);molecule.add(atom);if(k){let bond=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,.8,8),new THREE.MeshStandardMaterial({color:0xd8e8dc}));bond.position.copy(atom.position).multiplyScalar(.5);bond.rotation.z=k*1.25+Math.PI/2;molecule.add(bond)}}molecule.position.y=1.5;g.add(molecule)}
if(i===5){let cup=new THREE.Mesh(new THREE.CylinderGeometry(.75,.55,1.1,8,1,true),new THREE.MeshStandardMaterial({color:0xf4b66d,transparent:true,opacity:.7,side:THREE.DoubleSide}));cup.position.y=1.25;g.add(cup);let orb=new THREE.Mesh(new THREE.SphereGeometry(.36,16,12),new THREE.MeshStandardMaterial({color:0xffe4a0,emissive:0x805020}));orb.position.y=1.5;g.add(orb)}
// glow ring
let ring=new THREE.Mesh(new THREE.TorusGeometry(3.25,.045,8,64),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.75}));ring.rotation.x=Math.PI/2;ring.position.y=.56;g.add(ring);
g.userData.islandId=i;islandMeshes.push(g);
});
// bridges as dotted luminous paths
const paths=[[0,1],[1,2],[0,3],[3,4],[4,5],[2,5]];
paths.forEach(([a,b])=>{let p1=new THREE.Vector3(positions[a][0],-.3,positions[a][2]),p2=new THREE.Vector3(positions[b][0],-.3,positions[b][2]);let curve=new THREE.QuadraticBezierCurve3(p1,new THREE.Vector3((p1.x+p2.x)/2,-.05,(p1.z+p2.z)/2),p2);let pts=curve.getPoints(28);let geo=new THREE.BufferGeometry().setFromPoints(pts);let line=new THREE.Line(geo,new THREE.LineDashedMaterial({color:0x8bdacb,dashSize:.3,gapSize:.22,transparent:true,opacity:.55}));line.computeLineDistances();group.add(line)});
raycaster=new THREE.Raycaster();mouse=new THREE.Vector2();
canvas.addEventListener("click",onSceneClick);
window.addEventListener("resize",onResize);
animate();
}
function onSceneClick(e){let rect=renderer.domElement.getBoundingClientRect();mouse.x=((e.clientX-rect.left)/rect.width)*2-1;mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;raycaster.setFromCamera(mouse,camera);let hits=raycaster.intersectObjects(islandMeshes,true);if(hits.length){let obj=hits[0].object;while(obj.parent&&obj.userData.islandId===undefined)obj=obj.parent;if(obj.userData.islandId!==undefined)openIsland(obj.userData.islandId);else{let root=islandMeshes.find(g=>g===obj||g.children.includes(obj));if(root)openIsland(root.userData.islandId)}}}
function focusIsland(id){let p=islandMeshes[id].position;let dest=new THREE.Vector3(p.x+5, p.y+10, p.z+12);targetCamera={pos:dest,target:new THREE.Vector3(p.x,0,p.z)}}
function resetCamera(){targetCamera={pos:new THREE.Vector3(0,19,31),target:new THREE.Vector3(0,0,0)}}
function onResize(){if(!camera||!renderer)return;let c=document.getElementById("scene");camera.aspect=c.clientWidth/c.clientHeight;camera.updateProjectionMatrix();renderer.setSize(c.clientWidth,c.clientHeight)}
function animate(){requestAnimationFrame(animate);if(controls){controls.update();if(targetCamera){camera.position.lerp(targetCamera.pos,.045);controls.target.lerp(targetCamera.target,.045);if(camera.position.distanceTo(targetCamera.pos)<.08)targetCamera=null}islandMeshes.forEach((g,i)=>{g.position.y=Math.sin(Date.now()*.0008+i)*.12;g.rotation.y=Math.sin(Date.now()*.00025+i)*.025});renderer.render(scene,camera)}}
window.focusIsland=focusIsland;window.resetCamera=resetCamera;
init3D();
</script>
</body>
